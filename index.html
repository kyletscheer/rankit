<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RankIt — Rank it five ways. Keep what holds.</title>
  <meta name="description" content="Rank your options several different ways and see which choices hold up. Private, browser-only, no account." />
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://kylescheer.com/rankit/" />
  <meta property="og:title" content="RankIt — Rank it five ways. Keep what holds." />
  <meta property="og:description" content="A private decision tool: rank your options several ways and see which choices are robust." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kylescheer.com/rankit/" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="RankIt home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="5" height="8" rx="1"/><rect x="9.5" y="4" width="5" height="17" rx="1"/><rect x="16" y="9" width="5" height="12" rx="1"/></svg>
      RankIt
    </a>
    <nav class="steps" aria-label="Progress">
      <a href="#/" data-step="list"><span>1</span> List</a>
      <a href="#/rank" data-step="rank"><span>2</span> Rank</a>
      <a href="#/results" data-step="results"><span>3</span> Compare</a>
    </nav>
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="More options">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" data-action="share">Copy share link</button>
        <button role="menuitem" data-action="export-json">Save project file</button>
        <button role="menuitem" data-action="import-json">Open project file…</button>
        <button role="menuitem" data-action="export-csv">Export CSV</button>
        <hr />
        <button role="menuitem" data-action="new" class="danger">Start a new decision</button>
      </div>
      <input type="file" id="importInput" accept="application/json,.json" hidden />
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>Runs entirely in your browser. Nothing leaves your device unless you share it.</span>
    <span class="footer-links">
      <a href="https://www.kylescheer.com" target="_blank" rel="noopener">Kyle Scheer</a>
      <a href="https://ko-fi.com/scheerapps" target="_blank" rel="noopener">Ko-fi</a>
      <a href="https://github.com/kyletscheer/rankit" target="_blank" rel="noopener">GitHub</a>
    </span>
  </footer>

  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="ok" class="btn primary" id="confirmOk">Continue</button>
      </div>
    </form>
  </dialog>

  <dialog id="examplesDialog" class="dialog sheet" aria-labelledby="exTitle">
    <div class="sheet-head">
      <h2 id="exTitle">Examples</h2>
      <button class="icon-btn" id="exClose" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <input id="exSearch" class="input" type="search" placeholder="Search examples" autocomplete="off" />
    <div id="exGroups" class="ex-groups" role="tablist" aria-label="Categories"></div>
    <ul id="exList" class="ex-list"></ul>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="examples.js"></script>
  <script src="app.js"></script>
</body>
</html>
